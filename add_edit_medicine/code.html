<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CareConnect - Add/Edit Medicine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@500&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#002109",
                        "background": "#f8f9ff",
                        "inverse-primary": "#b4c5ff",
                        "tertiary-container": "#007f36",
                        "on-secondary-container": "#006f66",
                        "primary-fixed": "#dbe1ff",

                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#005320",
                        "surface-bright": "#f8f9ff",
                        "secondary": "#006a61",
                        "surface-container-low": "#eff4ff",
                        "surface": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-surface": "#0b1c30",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-tertiary-container": "#c7ffca",
                        "inverse-surface": "#213145",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#89f5e7",
                        "primary-container": "#2563eb",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "surface-variant": "#d3e4fe",
                        "outline": "#737686",
                        "primary": "#004ac6",
                        "outline-variant": "#c3c6d7",
                        "on-background": "#0b1c30",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#7ffc97",
                        "surface-dim": "#cbdbf5",
                        "surface-container-highest": "#d3e4fe",
                        "on-primary-container": "#eeefff",
                        "on-secondary-fixed-variant": "#005049",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#86f2e4",
                        "surface-tint": "#0053db",
                        "tertiary-fixed-dim": "#62df7d",
                        "tertiary": "#006329",
                        "surface-container": "#e5eeff",
                        "on-secondary-fixed": "#00201d",
                        "on-surface-variant": "#434655"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "3xl": "64px",
                        "gutter": "24px",
                        "unit": "4px",
                        "2xl": "48px",
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "label-md": ["Atkinson Hyperlegible Next"],
                        "body-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "display-lg": ["Inter"],

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "title-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
                    }
                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased min-h-screen pb-20">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-container-low text-primary dark:text-primary-fixed w-full top-0 shadow-sm border-b border-outline-variant dark:border-outline flex justify-between items-center px-lg h-16 sticky z-50">
<button onclick="location.href='../medication_list/code.html'" aria-label="Go back" class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 transition-transform p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed flex-1 text-center">Add Medicine</h1>
<div class="w-10"></div> <!-- Placeholder for balancing flex layout -->
</header>
<!-- Main Content -->
<main class="max-w-container-max mx-auto px-md md:px-gutter py-lg flex flex-col gap-lg">
<!-- Form Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-lg flex flex-col gap-xl">
<!-- Medicine Name -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="medicine-name">Medicine Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="medication">medication</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow h-12" id="medicine-name" placeholder="e.g. Lisinopril" type="text"/>
</div>
</div>
<!-- Dosage & Frequency Group -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Dosage -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="dosage">Dosage</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="scale">scale</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow h-12" id="dosage" placeholder="e.g. 10mg" type="text"/>
</div>
</div>
<!-- Frequency -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="frequency">Frequency</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="event_repeat">event_repeat</span>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-10 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow appearance-none h-12" id="frequency">
<option value="daily">Daily</option>
<option value="twice_daily">Twice a day</option>
<option value="weekly">Weekly</option>
<option value="as_needed">As needed</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Reminders Section -->
<div class="border-t border-outline-variant/30 pt-lg flex flex-col gap-lg">
<div class="flex justify-between items-center">
<div>
<h2 class="font-title-md text-title-md text-on-surface">Set Reminder</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Get notified when it's time.</p>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-surface-container-lowest after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Time Picker -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="reminder-time">Reminder Time</label>
<div class="relative max-w-[200px]">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="schedule">schedule</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow h-12" id="reminder-time" type="time" value="08:00"/>
</div>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col md:flex-row gap-md mt-md">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-12 rounded-lg shadow-sm hover:bg-on-primary-fixed-variant transition-colors active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
                Save Medicine
            </button>
<button class="w-full bg-surface-container-lowest border border-error text-error font-label-md text-label-md h-12 rounded-lg hover:bg-error-container transition-colors active:scale-95 transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
                Delete Medicine
            </button>
</div>
</main>
<script>
        // Ensure material symbols are correctly rendered
        document.querySelectorAll('span[data-icon]').forEach(span => {
            span.textContent = span.getAttribute('data-icon');
            if (span.getAttribute('data-weight') === 'fill') {
                span.style.fontVariationSettings = "'FILL' 1";
            }
        });
    </script>
</body></html>
