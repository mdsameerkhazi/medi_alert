<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional - Hidden Nav, Back button prioritized) -->
<header class="bg-background w-full top-0 sticky shadow-sm flex items-center justify-between px-md h-16 max-w-container-max mx-auto z-40">
<div class="flex items-center gap-md">
<button class="text-primary hover:bg-surface-variant transition-colors active:scale-95 duration-200 rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary md:font-headline-lg md:text-headline-lg">Edit Profile</h1>
</div>
<button class="text-primary hover:bg-surface-variant transition-colors active:scale-95 duration-200 rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<main class="flex-grow w-full max-w-2xl mx-auto px-md py-lg pb-3xl flex flex-col gap-lg">
<!-- Profile Picture Section -->
<section class="flex flex-col items-center justify-center pt-md pb-lg">
<div class="relative w-32 h-32 rounded-full mb-md group cursor-pointer shadow-md">
<img class="w-full h-full object-cover rounded-full border-4 border-surface-container-lowest" data-alt="A close up, realistic photograph of a professional healthcare patient profile picture placeholder, generic features, neutral background. The lighting is soft and flattering, typical of a modern clinical environment. The overall aesthetic is clean, trusting, and aligns with a calming blue and white medical UI." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8hKzWykjXL3Bc6eojuUGGmZADEDiGPBohpjrwYsEoYh4X8-tOO6CLx_GzdTcyQTz4_IWdWLXdaRHI7Olttb6blMDkXgw8FWwoVfCv4i8pTqU1Ccb013QYiKgm9OryMXGfQDFtK4RXmCrLTho1l-vLgXB1naxLNGDZ0dOOtKDxwWuZV5KPaAUOyA85yXWDaj3IajmdmMvH26tXv96Yd__cfdgizb0sMnuJ_7EyCjqnh2_4NwRYRDIi"/>
<div class="absolute inset-0 bg-inverse-surface/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-200">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary rounded-full p-2 shadow-sm border-2 border-surface-container-lowest flex items-center justify-center transform translate-x-1 translate-y-1">
<span class="material-symbols-outlined text-sm">edit</span>
</div>
</div>
<p class="font-body-md text-on-surface-variant text-center">Tap to change profile picture</p>
</section>
<!-- Edit Form -->
<form class="flex flex-col gap-lg bg-surface-container-lowest rounded-lg p-lg shadow-sm border border-outline-variant/30">
<div class="flex flex-col gap-md">
<!-- Full Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<input class="block w-full pl-[48px] pr-md py-3 bg-surface border-outline-variant/50 rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors min-h-[48px]" id="fullName" name="fullName" required="" type="text" value="Jane Doe"/>
</div>
</div>
<!-- Email Address Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">mail</span>
</div>
<input class="block w-full pl-[48px] pr-md py-3 bg-surface border-outline-variant/50 rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors min-h-[48px]" id="email" name="email" required="" type="email" value="jane.doe@example.com"/>
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="phone">Phone Number</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">call</span>
</div>
<input class="block w-full pl-[48px] pr-md py-3 bg-surface border-outline-variant/50 rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors min-h-[48px]" id="phone" name="phone" required="" type="tel" value="+1 (555) 123-4567"/>
</div>
</div>
<!-- Date of Birth Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="dob">Date of Birth</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
</div>
<input class="block w-full pl-[48px] pr-md py-3 bg-surface border-outline-variant/50 rounded-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-colors min-h-[48px]" id="dob" name="dob" required="" type="date" value="1985-10-15"/>
</div>
</div>
</div>
<!-- Action Area -->
<div class="pt-md flex flex-col gap-md mt-md border-t border-outline-variant/20">
<button class="w-full bg-primary text-on-primary py-3 rounded-lg font-title-md text-title-md hover:opacity-90 active:scale-95 transition-all shadow-sm flex items-center justify-center gap-2" type="submit">
                    Save Changes
                </button>
<button class="w-full bg-transparent text-primary py-3 rounded-lg font-title-md text-title-md border border-primary hover:bg-surface-variant transition-colors active:scale-95 flex items-center justify-center" type="button">
                    Cancel
                </button>
</div>
</form>
</main>
<!-- Bottom Nav Suppressed intentionally for transactional/task-focused screen -->
</body></html>
