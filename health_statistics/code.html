<!-- Log Vitals Modal -->
<div id="vitals-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
  <div class="bg-surface max-w-md w-full mx-4 rounded-2xl shadow-xl border border-outline-variant overflow-hidden transform translate-y-4 transition-all duration-300">
    <div class="bg-primary text-on-primary p-md flex items-center justify-between">
      <h3 class="font-title-md text-title-md flex items-center gap-sm">
        <span class="material-symbols-outlined">add_circle</span>
        Log Today's Vitals
      </h3>
      <button onclick="toggleVitalsModal()" class="text-on-primary hover:opacity-85 active:scale-95 transition-transform">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <form id="vitals-form" class="p-md space-y-md" onsubmit="submitVitalsForm(event)">
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs" for="vitals-heart">Heart Rate (BPM)</label>
        <input type="number" id="vitals-heart" class="w-full px-md py-sm bg-surface-container border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary" placeholder="e.g. 72" required>
      </div>
      <div class="grid grid-cols-2 gap-sm">
        <div>
          <label class="block font-label-md text-label-md text-on-surface mb-xs" for="vitals-sys">BP Systolic (mmHg)</label>
          <input type="number" id="vitals-sys" class="w-full px-md py-sm bg-surface-container border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary" placeholder="e.g. 120" required>
        </div>
        <div>
          <label class="block font-label-md text-label-md text-on-surface mb-xs" for="vitals-dia">BP Diastolic (mmHg)</label>
          <input type="number" id="vitals-dia" class="w-full px-md py-sm bg-surface-container border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary" placeholder="e.g. 80" required>
        </div>
      </div>
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs" for="vitals-sleep">Sleep Hours</label>
        <input type="number" step="0.1" id="vitals-sleep" class="w-full px-md py-sm bg-surface-container border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary" placeholder="e.g. 7.5" required>
      </div>
      <div>
        <label class="block font-label-md text-label-md text-on-surface mb-xs" for="vitals-steps">Daily Steps</label>
        <input type="number" id="vitals-steps" class="w-full px-md py-sm bg-surface-container border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface outline-none focus:border-primary" placeholder="e.g. 8000" required>
      </div>
      
      <button type="submit" class="w-full bg-primary text-on-primary py-sm rounded-lg font-label-md text-label-md shadow-md hover:bg-primary/95 active:scale-95 transition-all">
        Save Logs
      </button>
    </form>
  </div>

<!-- Toast Container -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-lg py-md rounded-xl shadow-lg font-body-md text-body-md opacity-0 pointer-events-none transition-opacity duration-300 z-50">
  Vitals logged successfully!
</div>

<script>
  function toggleVitalsModal() {
    const modal = document.getElementById('vitals-modal');
    const inner = modal.querySelector('.bg-surface');
    const isOpen = modal.classList.contains('opacity-0');
    if (isOpen) {
      modal.classList.remove('opacity-0', 'pointer-events-none');
      inner.classList.remove('translate-y-4');
    } else {
      modal.classList.add('opacity-0', 'pointer-events-none');
      inner.classList.add('translate-y-4');
    }
  }

  function submitVitalsForm(e) {
    e.preventDefault();
    
    const heart = document.getElementById('vitals-heart').value;
    const sys = document.getElementById('vitals-sys').value;
    const dia = document.getElementById('vitals-dia').value;
    const sleep = document.getElementById('vitals-sleep').value;
    const steps = document.getElementById('vitals-steps').value;

    // Simple card value updates:
    // Heart rate, blood pressure, sleep, and steps values in the UI:
    const values = document.querySelectorAll('.font-headline-lg, .font-display-lg');
    if (values.length >= 4) {
      values[0].textContent = heart; // Heart Rate value inside HR card
      values[1].textContent = sys + '/' + dia; // Blood Pressure value inside BP card
      values[2].textContent = sleep + 'h'; // Sleep value inside Sleep card
      values[3].textContent = parseInt(steps).toLocaleString(); // Steps value inside Steps card
    }

    // Add a Notification event to parent explorer
    if (window.parent && window.parent.loadNotifications) {
      const notifs = JSON.parse(localStorage.getItem('notifications')) || [];
      notifs.unshift({
        id: Date.now(),
        title: "Vitals Logged",
        message: `Logged: HR ${heart} BPM, BP ${sys}/${dia} mmHg, Sleep ${sleep}h, Steps ${steps}.`,
        is_read: false,
        created_at: new Date().toISOString()
      });
      localStorage.setItem('notifications', JSON.stringify(notifs));
      window.parent.loadNotifications();
    }

    showToast('Vitals logged and synchronized!');
    toggleVitalsModal();
    document.getElementById('vitals-form').reset();
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.remove('opacity-0');
    toast.classList.add('opacity-100');
    setTimeout(() => {
      toast.classList.remove('opacity-100');
      toast.classList.add('opacity-0');
    }, 2500);
  }
</script>
