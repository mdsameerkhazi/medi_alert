<script>
        // Simple logic for the Hold-to-Trigger SOS button visual effect
        const sosButton = document.getElementById('sosButton');
        const progressRing = document.getElementById('progressRing');
        const instructionText = document.getElementById('instructionText');
        
        let holdTimer;
        let progress = 0;
        const totalHoldTime = 3000; // 3 seconds
        const updateInterval = 50; // Update every 50ms
        const maxOffset = 295;
        
        const resetProgress = () => {
            clearInterval(holdTimer);
            progress = 0;
            progressRing.style.strokeDashoffset = maxOffset;
            sosButton.classList.remove('scale-[0.97]');
            instructionText.innerText = "Press and hold for 3 seconds";
            instructionText.classList.remove('text-error');
        };

        const startProgress = () => {
            sosButton.classList.add('scale-[0.97]');
            instructionText.innerText = "Holding...";
            
            holdTimer = setInterval(() => {
                progress += updateInterval;
                const percentage = Math.min(progress / totalHoldTime, 1);
                const offset = maxOffset - (percentage * maxOffset);
                progressRing.style.strokeDashoffset = offset;

                if (progress >= totalHoldTime) {
                    clearInterval(holdTimer);
                    triggerSOS();
                }
            }, updateInterval);
        };

        const triggerSOS = () => {
            instructionText.innerText = "SOS TRIGGERED!";
            instructionText.classList.add('text-error', 'font-bold');
            // Flash effect on body
            document.body.classList.add('bg-error');
            setTimeout(() => document.body.classList.remove('bg-error'), 200);
            setTimeout(() => document.body.classList.add('bg-error'), 400);
            setTimeout(() => document.body.classList.remove('bg-error'), 600);
        };

        // Mouse events
        sosButton.addEventListener('mousedown', startProgress);
        sosButton.addEventListener('mouseup', resetProgress);
        sosButton.addEventListener('mouseleave', resetProgress);

        // Touch events
        sosButton.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent scroll/zoom while holding
            startProgress();
        });
        sosButton.addEventListener('touchend', resetProgress);
        sosButton.addEventListener('touchcancel', resetProgress);
    </script>
