<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom styles for OTP inputs to hide number arrows and handle focus better */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;

<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background h-full flex flex-col font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Area -->
<main class="flex-grow flex flex-col justify-center px-gutter w-full max-w-container-max mx-auto py-3xl">
<div class="max-w-md mx-auto w-full">
<!-- Back Action -->
<button aria-label="Go back" class="mb-xl flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant text-on-surface-variant transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Header Section -->
<div class="mb-2xl">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-sm">Verify Email</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    We've sent a 6-digit verification code to <span class="font-bold text-on-background">j***@example.com</span>. Please enter it below.
                </p>
</div>
<!-- OTP Input Form -->
<form class="space-y-xl" id="otp-form">
<!-- OTP Input Grid -->
<div class="flex justify-between gap-sm" id="otp-container">
<input aria-label="Digit 1" autofocus="" class="w-12 h-14 md:w-14 md:h-16 text-center font-title-md text-title-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-background focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number"/>
<input aria-label="Digit 2" class="w-12 h-14 md:w-14 md:h-16 text-center font-title-md text-title-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-background focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number"/>
<input aria-label="Digit 3" class="w-12 h-14 md:w-14 md:h-16 text-center font-title-md text-title-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-background focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number"/>
<input aria-label="Digit 4" class="w-12 h-14 md:w-14 md:h-16 text-center font-title-md text-title-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-background focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number"/>
<input aria-label="Digit 5" class="w-12 h-14 md:w-14 md:h-16 text-center font-title-md text-title-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-background focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number"/>
<input aria-label="Digit 6" class="w-12 h-14 md:w-14 md:h-16 text-center font-title-md text-title-md bg-surface-container-lowest border border-outline-variant rounded-lg text-on-background focus:border-primary focus:ring-2 focus:ring-primary-fixed outline-none transition-all" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="number"/>
</div>
<!-- Error Message (Hidden by default) -->
<div class="hidden flex items-center gap-sm text-error bg-error-container/50 p-sm rounded-md" id="error-message">
<span class="material-symbols-outlined text-sm">error</span>
<span class="font-label-md text-label-md text-on-error-container">Invalid code. Please try again.</span>
</div>
<!-- Resend Action -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        Didn't receive the code? 
                        <button class="font-label-md text-label-md font-bold text-primary hover:text-primary-container disabled:text-outline disabled:cursor-not-allowed transition-colors ml-1" disabled="" id="resend-btn" type="button">
                            Resend in <span id="timer">00:30</span>
</button>
</p>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary hover:bg-surface-tint text-on-primary font-title-md text-title-md py-md rounded-lg shadow-sm active:scale-[0.98] transition-all flex justify-center items-center gap-sm" type="submit">
                    Verify
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</form>
<!-- Success Overlay (Hidden by default, shown via JS for demo) -->
<div class="hidden fixed inset-0 bg-background/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center p-gutter" id="success-overlay">
<div class="bg-surface-container-lowest p-2xl rounded-xl shadow-lg text-center max-w-sm w-full border border-outline-variant">
<div class="w-16 h-16 bg-tertiary-container text-on-tertiary-container rounded-full flex items-center justify-center mx-auto mb-lg">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">task_alt</span>
</div>
<h2 class="font-title-md text-title-md text-on-background mb-sm">Email Verified!</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-xl">Your account is now secure. Redirecting to dashboard...</p>
<div class="w-full h-1 bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary animate-[pulse_2s_ease-in-out_infinite] w-1/2 rounded-full"></div>
</div>
</div>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-container input');
            const form = document.getElementById('otp-form');
            const timerSpan = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            const errorMsg = document.getElementById('error-message');
            const successOverlay = document.getElementById('success-overlay');

            // Timer Logic
            let timeLeft = 30;
            let timerId;

            function startTimer() {
                clearInterval(timerId);
                timeLeft = 30;
                resendBtn.disabled = true;
                timerSpan.textContent = `00:${timeLeft}`;
                
                timerId = setInterval(() => {
                    timeLeft--;
                    let seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                    timerSpan.textContent = `00:${seconds}`;
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        resendBtn.disabled = false;
                        resendBtn.innerHTML = 'Resend Code';
                    }
                }, 1000);
            }

            startTimer();

            resendBtn.addEventListener('click', () => {
                if (!resendBtn.disabled) {
                    resendBtn.innerHTML = `Resend in <span id="timer">00:30</span>`;
                    // Re-grab the timer span as it was overwritten
                    const newTimerSpan = document.getElementById('timer');
                    startTimer();
                    // Simulate resending logic here
                    errorMsg.classList.add('hidden');
                    inputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('border-error', 'text-error');
                    });
                    inputs[0].focus();
                }
            });

            // OTP Input Logic
            inputs.forEach((input, index) => {
                // Focus behavior
                input.addEventListener('focus', (e) => {
                    e.target.select();
                });

                // Input handling
                input.addEventListener('input', (e) => {
                    errorMsg.classList.add('hidden');
                    inputs.forEach(i => i.classList.remove('border-error', 'text-error'));

                    // Handle paste if multiple digits are entered in one box
                    if(e.target.value.length > 1) {
                        let pastedValue = e.target.value.substring(0, inputs.length).replace(/\D/g, '');
                        for(let i = 0; i < inputs.length; i++) {
                            if(i < pastedValue.length) {
                                inputs[i].value = pastedValue[i];
                            } else {
                                inputs[i].value = '';
                            }
                        }
                        let nextEmpty = Array.from(inputs).findIndex(inp => inp.value === '');
                        if(nextEmpty !== -1) {
                            inputs[nextEmpty].focus();
                        } else {
                            inputs[inputs.length - 1].focus();
                        }
                        return;
                    }

                    // Move to next input
                    if (e.target.value !== '') {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                // Backspace handling
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
            });

            // Form Submission Simulation
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const otp = Array.from(inputs).map(i => i.value).join('');
                
                if (otp.length < 6) {
                    // Show error state
                    errorMsg.classList.remove('hidden');
                    inputs.forEach(input => {
                        input.classList.add('border-error', 'text-error');
                    });
                } else {
                    // Simulate Success
                    errorMsg.classList.add('hidden');
                    successOverlay.classList.remove('hidden');
                    
                    // Simulate redirect after 2 seconds
                    setTimeout(() => {
                        alert('Redirecting to dashboard...');
                        successOverlay.classList.add('hidden');
                        inputs.forEach(input => input.value = '');
                        inputs[0].focus();
                    }, 2000);
                }
            });
        });
    </script>
</body></html>
